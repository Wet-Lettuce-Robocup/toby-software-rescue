metadata:
  name: custom-model-yolov8
  namespace: cvat
  annotations:
    name: custom-model-yolov8
    type: detector
    framework: pytorch
    spec: |
      [
        { "id": 0, "name": "black" },
        { "id": 1, "name": "silver" }
      ]
spec:
  description: custom-model-yolov8
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s
  build:
    image: custom-model-yolov8:latest

    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: RUN
          value: |-
            apt-get update \
            && apt-get install -y --no-install-recommends \
              curl \
              git \
              python3 \
              python3-dev \
              python3-pip \
              python-is-python3 \
              libsm6 \
              libxext6 \
              libgl1 \
              libglib2.0-0 \
            && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: |-
            --mount=type=cache,target=/root/.cache/pip \
            pip install \
              ultralytics opencv-python numpy
        - kind: WORKDIR
          value: /opt/nuclio

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
